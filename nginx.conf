server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy FastAPI (client-facing API)
    location /client/ {
        proxy_pass http://fastapi_client:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy Flask admin API
    location /api/v1/ {
        proxy_pass http://flask_api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React SPA — serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
