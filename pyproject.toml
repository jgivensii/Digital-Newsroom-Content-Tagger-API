[project]
name = "Content_Tagger_API"
version = "0.0.1"
description = "A customer-review intake and analytics backend that gives a product manager persona a fast, structured way to see what customers actually think about their catalog, not just a firehose of raw text."
authors = [
    {name = "Jelani Givens II", email = "jgivens@skillstorm.com"} ]
requires-python = ">=3.11"

dependencies = [
    "flask>=3.0,<4.0",
    "flask-sqlalchemy>=3.0,<4.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "flask-migrate>=4.0,<5.0",
    "pydantic>=2.10,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg>=3.0,<4.0",
    "boto3>=1.34,<2.0",
    "structlog>=24.0,<26.0",
    "python-dotenv>=1.0"
]

[project.optional-dependencies]
test =[
    "pytest>=8.0,<9.0",
    "pytest-mock>=3.15,<4.0",
    "moto>=5.2.0",
    "pillow>=10.0"
    ]

[build-system]
requires = ["setuptools>=65,<75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["content_api", "client_api", "models_api"]
